services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: ../.env
    environment:
      KNOWPAGE_DB: /app/data/knowpage.db
    volumes:
      - knowpage-data:/app/data
    ports:
      - "127.0.0.1:8765:8765"
    restart: unless-stopped
    mem_limit: 1g
    pids_limit: 64
volumes:
  knowpage-data:
